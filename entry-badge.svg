<svg xmlns="http://www.w3.org/2000/svg" width="60" height="20" viewBox="0 0 60 20">
  <title>Entry</title>
  <clipPath id="rounded">
    <rect width="60" height="20" rx="3"/>
  </clipPath>
  <g clip-path="url(#rounded)">
    <rect width="60" height="20" fill="#32D27D"/>
    <image href="data:image/png;base64,"
